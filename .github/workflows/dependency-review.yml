name: Dependency Review

# Roda em Pull Requests para bloquear a entrada de dependencias
# vulneraveis ou com licenca incompativel ANTES do merge.
on:
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Revisao de dependencias
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Dependency Review (CVEs e licencas)
        uses: actions/dependency-review-action@v5
        with:
          # Bloqueia o merge se entrar vulnerabilidade de severidade alta.
          fail-on-severity: high
          # Comenta o resumo no proprio Pull Request.
          comment-summary-in-pr: always
          # Nao permite dependencias sem licenca declarada.
          allow-licenses: >-
            MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, EPL-2.0,
            LGPL-2.1-or-later, LGPL-2.1-only, LGPL-3.0-or-later, LGPL-3.0-only,
            GPL-2.0-or-later, GPL-2.0-only, GPL-3.0-or-later, GPL-3.0-only,
            MPL-2.0, ISC, CDDL-1.0, CDDL-1.1, 0BSD, CC0-1.0, Unlicense
          # Mostra a primeira versao corrigida de cada vulnerabilidade.
          show-patched-versions: true
          warn-only: false
